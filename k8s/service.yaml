# service.yaml: exposes the deployment inside the cluster via ClusterIP, with an ALB ingress
apiVersion: v1
kind: Service
metadata:
  name: shopsmart-backend-svc
  namespace: shopsmart
  labels:
    app: shopsmart-backend
spec:
  type: ClusterIP
  selector:
    app: shopsmart-backend
  ports:
    - name: http
      port: 80
      targetPort: 5001
      protocol: TCP
---
# ingress.yaml: routes external traffic to the backend service via the AWS ALB controller
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopsmart-ingress
  namespace: shopsmart
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/healthcheck-path: "/api/health"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shopsmart-backend-svc
                port:
                  number: 80

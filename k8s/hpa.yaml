# hpa.yaml: scales the deployment between 2 and 5 replicas based on CPU and memory utilisation
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shopsmart-backend-hpa
  namespace: shopsmart
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shopsmart-backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

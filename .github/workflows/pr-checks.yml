name: PR Quality Gates

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  #  Frontend PR Checks 
  frontend-pr-lint:
    name: "PR — Frontend Lint (ESLint)"
    runs-on: ubuntu-latest
    if: |
      contains(github.event.pull_request.changed_files, 'client') ||
      github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Lint — Frontend (ESLint)
        working-directory: client
        run: npm run lint

  frontend-pr-format:
    name: "PR — Frontend Format Check (Prettier)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Format check — Frontend (Prettier)
        working-directory: client
        run: npm run format:check

  #  Backend PR Checks 
  backend-pr-lint:
    name: "PR — Backend Lint (ESLint)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Lint — Backend (ESLint)
        working-directory: server
        run: npm run lint

  backend-pr-format:
    name: "PR — Backend Format Check (Prettier)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Format check — Backend (Prettier)
        working-directory: server
        run: npm run format:check

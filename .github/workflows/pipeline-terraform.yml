# pipeline-terraform: provisions AWS infrastructure via Terraform on every push to main
name: "pipeline-terraform"

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/pipeline-terraform.yml"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/pipeline-terraform.yml"
  workflow_dispatch:
    inputs:
      destroy:
        description: "Set to true to run terraform destroy"
        required: false
        default: "false"

env:
  TF_VERSION: "1.7.5"
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
  TF_VAR_environment: "prod"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

defaults:
  run:
    working-directory: terraform

jobs:
  # Initialises the backend and validates configuration on every trigger
  terraform-validate:
    name: "TF Validate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Create the S3 backend bucket and DynamoDB lock table if they do not exist
      - name: Bootstrap Terraform state backend
        working-directory: .
        run: |
          chmod +x scripts/bootstrap-tfstate.sh
          ./scripts/bootstrap-tfstate.sh
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=shopsmart-tfstate-${AWS_REGION}" \
            -backend-config="key=shopsmart/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=shopsmart-tfstate-lock" \
            -reconfigure

      # Format check is advisory only and will not block the pipeline
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Validate
        run: terraform validate -no-color

  # Generates an execution plan and posts it as a PR comment
  terraform-plan:
    name: "TF Plan"
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: always() && needs.terraform-validate.result == 'success'

    outputs:
      plan-exitcode: ${{ steps.plan.outputs.exitcode }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=shopsmart-tfstate-${AWS_REGION}" \
            -backend-config="key=shopsmart/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=shopsmart-tfstate-lock" \
            -reconfigure

      # exitcode 0 = no changes, 2 = changes present, 1 = error
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -no-color \
            -out=tfplan \
            -detailed-exitcode \
            -var="image_tag=latest" \
          2>&1 | tee plan_output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            terraform/tfplan
            terraform/plan_output.txt
          retention-days: 5

      # Post the plan output as a comment on the pull request
      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/plan_output.txt', 'utf8');
            const maxLen = 65000;
            const body = plan.length > maxLen
              ? plan.substring(0, maxLen) + '\n\n... (truncated)'
              : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan\n\`\`\`hcl\n${body}\n\`\`\``
            });

      - name: Fail if plan errored
        if: steps.plan.outputs.exitcode == '1'
        run: |
          echo "Terraform plan failed with errors."
          exit 1

  # Applies the saved plan to AWS, runs only on push to main
  terraform-apply:
    name: "TF Apply"
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.terraform-plan.result == 'success' &&
      github.event.inputs.destroy != 'true'

    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=shopsmart-tfstate-${AWS_REGION}" \
            -backend-config="key=shopsmart/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=shopsmart-tfstate-lock" \
            -reconfigure

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform/

      - name: Terraform Apply
        run: |
          terraform apply \
            -no-color \
            -auto-approve \
            tfplan

      # Export key outputs for use by pipeline-ecs and pipeline-eks
      - name: Export Terraform outputs
        id: tf-outputs
        run: |
          ECR_URL=$(terraform output -raw ecr_repository_url   2>/dev/null || echo "")
          ECS_CLUSTER=$(terraform output -raw ecs_cluster_name 2>/dev/null || echo "")
          ECS_SERVICE=$(terraform output -raw ecs_service_name 2>/dev/null || echo "")
          EKS_CLUSTER=$(terraform output -raw eks_cluster_name 2>/dev/null || echo "")

          echo "ecr_url=${ECR_URL}"         >> "$GITHUB_OUTPUT"
          echo "ecs_cluster=${ECS_CLUSTER}" >> "$GITHUB_OUTPUT"
          echo "ecs_service=${ECS_SERVICE}" >> "$GITHUB_OUTPUT"
          echo "eks_cluster=${EKS_CLUSTER}" >> "$GITHUB_OUTPUT"

          {
            echo "## Infrastructure Applied"
            echo "| Output | Value |"
            echo "|--------|-------|"
            echo "| ECR URL     | \`${ECR_URL}\` |"
            echo "| ECS Cluster | \`${ECS_CLUSTER}\` |"
            echo "| EKS Cluster | \`${EKS_CLUSTER}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Tears down all Terraform-managed resources, triggered manually with destroy=true
  terraform-destroy:
    name: "TF Destroy"
    runs-on: ubuntu-latest
    if: github.event.inputs.destroy == 'true'

    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=shopsmart-tfstate-${AWS_REGION}" \
            -backend-config="key=shopsmart/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=shopsmart-tfstate-lock" \
            -reconfigure

      - name: Terraform Destroy
        run: |
          terraform destroy \
            -no-color \
            -auto-approve \
            -var="image_tag=latest"

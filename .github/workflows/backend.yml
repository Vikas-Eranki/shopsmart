name: Backend CI

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: server

jobs:
  #  Job 1: Lint 
  lint:
    name: "Backend — Lint (ESLint)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  #  Job 2: Format Check 
  format:
    name: "Backend — Format Check (Prettier)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting with Prettier
        run: npm run format:check

  #  Job 3: API Tests (Unit + Integration via supertest) 
  api-tests:
    name: "Backend — API Tests (Jest + Supertest)"
    runs-on: ubuntu-latest
    needs: [lint, format]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run API tests — Health endpoint
        run: npm run test:api -- --testNamePattern="GET /api/health"

      - name: Run API tests — Products endpoints
        run: npm run test:api -- --testNamePattern="GET /api/products"

      - name: Run API tests — Cart endpoints
        run: npm run test:api -- --testNamePattern="Cart API"

      - name: Run API tests — Checkout endpoint
        run: npm run test:api -- --testNamePattern="POST /api/checkout"

      - name: Run full API test suite
        run: npm run test:api

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: server/coverage/
          retention-days: 7

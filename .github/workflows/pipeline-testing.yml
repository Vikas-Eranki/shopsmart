# pipeline-testing: runs lint, unit tests, and integration tests on every push and PR
name: "pipeline-testing"

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/pipeline-testing.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/pipeline-testing.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: server

jobs:
  # ESLint static analysis
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint

  # Prettier formatting gate
  format-check:
    name: "Format Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run format:check

  # Jest unit tests with JUnit XML and LCOV coverage output
  unit-tests:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    needs: [lint, format-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - run: npm ci

      # Run only unit-scoped tests, allow missing test folder without failing
      - name: Run unit tests
        run: |
          npm run test -- \
            --testPathPattern="tests/unit" \
            --forceExit \
            --coverage \
            --coverageDirectory=coverage/unit \
            --coverageReporters=lcov,text,json-summary \
            --passWithNoTests \
            2>&1 | tee unit-test-output.txt

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            server/test-reports/backend-junit.xml
            server/unit-test-output.txt
          retention-days: 14

      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-report
          path: server/coverage/unit/
          retention-days: 14

  # Supertest integration tests with full coverage report
  integration-tests:
    name: "Integration Tests"
    runs-on: ubuntu-latest
    needs: [lint, format-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - run: npm ci

      - name: Run integration tests with coverage
        run: npm run test:ci 2>&1 | tee integration-test-output.txt
        env:
          NODE_ENV: test

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: |
            server/test-reports/backend-junit.xml
            server/integration-test-output.txt
          retention-days: 14

      - name: Upload integration coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-coverage-report
          path: server/coverage/
          retention-days: 14

      # Annotate the PR with test results using the JUnit XML
      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: server/test-reports/backend-junit.xml
          check_name: "Integration Test Results"
          comment_title: "Integration Test Results"
          fail_on: "test failures"

  # Aggregates results and fails the pipeline if any test job failed
  report:
    name: "Test Summary"
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()
    steps:
      - name: Download all test artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-reports/

      - name: Write job summary
        run: |
          {
            echo "## pipeline-testing report"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| Unit Tests        | ${{ needs.unit-tests.result }} |"
            echo "| Integration Tests | ${{ needs.integration-tests.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: .

      - name: Fail if any test job failed
        if: >
          needs.unit-tests.result == 'failure' ||
          needs.integration-tests.result == 'failure'
        run: |
          echo "One or more test jobs failed. Blocking pipeline-terraform."
          exit 1
